[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pin the compiler: a floating version is a reproducibility and audit hazard.
solc_version = "0.8.36"
# Target Cancun, which Base and Base Sepolia support.
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
# The IR pipeline reduces both deployment and posting gas.
via_ir = true
# Reproducible bytecode: no IPFS metadata hash appended.
bytecode_hash = "none"
# Compiler and lint warnings are errors.
deny = "warnings"

# The deployments test reads the published addresses.
fs_permissions = [{ access = "read", path = "./deployments.json" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = false

[lint]
# incorrect-shift: `1 << bit` is the intended shape of every bitmap operation
#   (nonce bitmap); the heuristic flags it as a probable argument swap.
# reentrancy-events: the Board's only external calls are STATICCALLs (a gate, or
#   an author's ERC-1271 check), which cannot change state or emit events, so
#   emitting `Posted` after them is safe. Excluded here rather than with an
#   inline waiver because older forge versions reject waivers naming rules they
#   do not know.
exclude_lints = ["incorrect-shift", "reentrancy-events"]
# Lint the contracts, not the tests and scripts: test code ignores return
# values, loops over calls, and pranks by design.
ignore = ["test/**/*.sol", "script/**/*.sol"]

[fmt]
line_length = 100
# Wrap comments longer than the line, keeping `///` (NatSpec) intact.
wrap_comments = true
tab_width = 4
bracket_spacing = false
int_types = "long"
